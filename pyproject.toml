[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-kaizen"
version = "0.1.0"
description = "Hermes-first continuous improvement discovery and analysis CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Duncan Trevithick" }]
dependencies = []

[project.scripts]
agent-kaizen = "agent_kaizen.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
